name: Build executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # "Run workflow"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: DocumentUnderstands-windows.exe
          - os: ubuntu-latest
            asset: DocumentUnderstands-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 3.14
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then SEP=';'; else SEP=':'; fi
          pyinstaller --onefile --console --clean --noconfirm \
            --hidden-import engineio.async_drivers.threading \
            --hidden-import socketio \
            --collect-data docx \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            --add-data "LICENSES.txt${SEP}." \
            --name DocumentUnderstands app.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp "dist/DocumentUnderstands.exe" "out/${{ matrix.asset }}"
          else
            cp "dist/DocumentUnderstands" "out/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true